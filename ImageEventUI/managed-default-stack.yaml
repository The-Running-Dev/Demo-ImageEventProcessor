AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'
Description: Managed default stack for additional resources

Resources:
  ExampleLambdaFunction:
    Type: 'AWS::Serverless::Function'
    Properties:
      Handler: index.handler
      Runtime: nodejs18.x
      CodeUri: s3://example-bucket/example-code.zip
      MemorySize: 128
      Timeout: 30
      Environment:
        Variables:
          EXAMPLE_ENV_VAR: 'example-value'

  ExampleDynamoDBTable:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName: 'ExampleTable'
      AttributeDefinitions:
        - AttributeName: 'Id'
          AttributeType: 'S'
      KeySchema:
        - AttributeName: 'Id'
          KeyType: 'HASH'
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5

Outputs:
  ExampleLambdaFunctionArn:
    Description: 'ARN of the example Lambda function'
    Value: !GetAtt ExampleLambdaFunction.Arn
  ExampleDynamoDBTableName:
    Description: 'Name of the example DynamoDB table'
    Value: !Ref ExampleDynamoDBTable
